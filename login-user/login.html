<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../common/auth-theme.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card">
        <h1 class="auth-title">Login</h1>
        <p class="auth-subtitle">Use your unique username and password.</p>

        <form id="login-form" class="auth-form" method="post" action="javascript:void(0)" novalidate>
          <div>
            <label class="field-label" for="username">Username</label>
            <div class="field-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="currentColor" stroke-width="1.7" />
                <path d="M4 20a8 8 0 1 1 16 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
              <input class="auth-input" type="text" name="username" id="username" placeholder="john_dev" required />
            </div>
          </div>

          <div>
            <label class="field-label" for="pass">Password</label>
            <div class="field-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="4.5" y="11" width="15" height="9" rx="2" stroke="currentColor" stroke-width="1.7" />
                <path d="M8 11V8a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
              <input class="auth-input" type="password" name="password" id="pass" placeholder="Your password" minlength="8" required />
            </div>
          </div>

          <button type="button" id="loginbtn" class="auth-btn">
            <span class="btn-row">
              <span id="btn-text">Login</span>
              <span id="btn-loader" class="loader" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M12 3a9 9 0 1 1-9 9" stroke="#0a2e23" stroke-width="2.5" stroke-linecap="round" />
                  <path d="M9 3h3a9 9 0 0 1 9 9v1" stroke="#eafff8" stroke-width="2" stroke-linecap="round" />
                </svg>
              </span>
            </span>
          </button>

          <div id="progress" class="progress" aria-hidden="true">
            <div class="bar"></div>
          </div>

          <p class="auth-meta">
            Not registered yet?
            <a href="../register-user/index.html">Register here</a>
          </p>
        </form>
      </section>
    </main>

    <div id="toast-wrap" class="toast-wrap" aria-live="polite" aria-atomic="true"></div>

    <script src="./login.js"></script>
  </body>
</html>
