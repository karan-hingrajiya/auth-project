<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile</title>
    <link rel="stylesheet" href="../common/auth-theme.css" />
    <link rel="stylesheet" href="./getme.css" />
  </head>
  <body>
    <main class="profile-shell">
      <section class="profile-card">
        <header class="profile-head">
          <div class="avatar" aria-hidden="true">Z</div>
          <div>
            <p class="kicker">Authenticated Session</p>
            <h1 class="profile-title">Welcome, Zoro</h1>
            <p class="profile-subtitle">Your account details and security status.</p>
          </div>
        </header>

        <section class="stats-grid">
          <article class="stat-box">
            <p class="stat-label">Role</p>
            <p class="stat-value">USER</p>
          </article>
          <article class="stat-box">
            <p class="stat-label">Status</p>
            <p class="stat-value success">Active</p>
          </article>
          <article class="stat-box">
            <p class="stat-label">Profile ID</p>
            <p class="stat-value">USR-001</p>
          </article>
        </section>

        <section class="details-panel">
          <h2>Profile Information</h2>
          <div class="detail-row">
            <span>Username</span>
            <strong>zoro</strong>
          </div>
          <div class="detail-row">
            <span>Email</span>
            <strong>zoro@example.com</strong>
          </div>
          <div class="detail-row">
            <span>Last Login</span>
            <strong>Today</strong>
          </div>
          <div class="detail-row">
            <span>Security</span>
            <strong>Password Protected</strong>
          </div>
        </section>

        <footer class="profile-actions">
          <a class="auth-btn logout-btn" href="../logout-user/logout.html">Logout</a>
        </footer>
      </section>
    </main>
  </body>
</html>
